services:
  init-permissions:
    image: alpine:3.20
    user: "0:0"
    volumes:
      - app-storage:/storage
    command:
      - sh
      - -c
      - |
        chown -R 1000:1000 /storage
    restart: "no"
  app:
    restart: always
    image: "solidtime/solidtime:${SOLIDTIME_IMAGE_TAG:-latest}"
    user: "1000:1000"
    networks:
      - internal
    volumes:
      - app-storage:/var/www/html/storage
    environment:
      CONTAINER_MODE: http
      AUTO_DB_MIGRATE: "true"
    healthcheck:
      test: [ "CMD", "curl", "--fail", "http://localhost:8000/health-check/up" ]
    env_file:
      - .env
    depends_on:
      - init-permissions:
          condition: service_completed_successfully
      - database
  scheduler:
    restart: always
    image: "solidtime/solidtime:${SOLIDTIME_IMAGE_TAG:-latest}"
    user: "1000:1000"
    networks:
      - internal
    volumes:
      - app-storage:/var/www/html/storage
    environment:
      CONTAINER_MODE: scheduler
      AUTO_DB_MIGRATE: "true"
    healthcheck:
      test: [ "CMD", "healthcheck" ]
    env_file:
      - .env
    depends_on:
      - init-permissions:
          condition: service_completed_successfully
      - database
  queue:
    restart: always
    image: "solidtime/solidtime:${SOLIDTIME_IMAGE_TAG:-latest}"
    user: "1000:1000"
    networks:
      - internal
    volumes:
      - app-storage:/var/www/html/storage
    environment:
      CONTAINER_MODE: worker
      WORKER_COMMAND: "php /var/www/html/artisan queue:work"
      AUTO_DB_MIGRATE: "true"
    healthcheck:
      test: [ "CMD", "healthcheck" ]
    env_file:
      - .env
    depends_on:
      - init-permissions:
          condition: service_completed_successfully
      - database
  database:
    restart: always
    image: 'postgres:15'
    #    ports:
    #      - '${FORWARD_DB_PORT:-5432}:5432'
    environment:
      PGPASSWORD: '${DB_PASSWORD:-secret}'
      POSTGRES_DB: '${DB_DATABASE}'
      POSTGRES_USER: '${DB_USERNAME}'
      POSTGRES_PASSWORD: '${DB_PASSWORD:-secret}'
    volumes:
      - 'database-storage:/var/lib/postgresql/data'
    networks:
      - internal
    healthcheck:
      test:
        - CMD
        - pg_isready
        - '-q'
        - '-d'
        - '${DB_DATABASE}'
        - '-U'
        - '${DB_USERNAME}'
      retries: 3
      timeout: 5s
  gotenberg:
    image: gotenberg/gotenberg:8
    networks:
      - internal
    healthcheck:
      test: [ "CMD", "curl", "--silent", "--fail", "http://localhost:3000/health" ]
networks:
  internal:
volumes:
  database-storage:
  app-storage:
